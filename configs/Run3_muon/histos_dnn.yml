'h_dnn_pred_S5':
  x-axis: "DNN score"
  y-axis: "Events"
  y-axis-format: "%1% / bin"
  log-y: true
  log-x: true
  sort-by-yields: true
  blinded-range: [7., 99.99]
  save-extensions: ['pdf','png']
  for-yields: true
  yields-table-order: 0
  yields-title: 'DNN'
  ratio-y-axis-range: [0.01, 2]
  ratio-y-axis-auto-range: false
  signal-normalize-data: false
