configuration:
  width: 450
  height: 450
  luminosity-label: '%1$.1f fb^{-1} (13.6 TeV)'
  experiment: " CMS"
  experiment-label-paper: true
  extra-label: " "
  root: ''
  luminosity: 9451 
  luminosity-error: 0.013
  error-fill-style: 3254
  error-fill-color: "#ee556270"
  staterror-fill-style: 3145
  staterror-fill-color: 7
  ratio-fit-error-fill-style: 1001
  ratio-fit-error-fill-color: "#aa556270"
  ratio-fit-line-color: "#0B486B"
  blinded-range-fill-color: "#29556270"
  blinded-range-fill-style: 1001
  yields-table-align: v
  book-keeping-file: 'plots.root'
  yields-table-numerical-precision-yields: 1
  generated-events-histogram: 'hcounter'
  generated-events-bin: 2
  #syst-only: true

files: 
  include: ['files.yml']
  #include: ['files_fake.yml']

systematics:
  - tt_xsec: {type: const, value: 1.05, on: '(hist_TTto|TT[tT]o)'}
  - singleTop_xsec: {type: const, value: 1.25, on: '(hist_T[Bb]|hist_TQ|hist_TW|hist_Tbar|ST_)'}
  - ttH_xsec: {type: const, value: 1.20, on: '(hist_TTH|ttH)'}
  - ttW_xsec: {type: const, value: 1.068, on: '(hist_TTW|TTW)'}
  - ttZ_xsec: {type: const, value: 1.096, on: '(hist_TTZ|TTZ)'}
  - wjets_xsec: {type: const, value: 1.30, on: '(hist_Wto|WJets)'}
  - diboson_xsec: {type: const, value: 1.30, on: '(hist_WW|hist_WZ|hist_ZZ|WW|WZ|ZZ)'}
  - dy_xsec: {type: const, value: 1.30, on: '(hist_DY|DYJets|DY)'}
  - qcd_xsec: {type: const, value: 1.5, on: 'QCD'}
  #- muExtra: {type: const, value: 1.005}
  - tes
  - jer
  - jesAbsolute
  - jesAbsolute_2023
  - jesBBEC1
  - jesBBEC1_2023
  - jesFlavorPureGluon
  - jesFlavorPureQuark
  - jesFlavorPureCharm
  - jesFlavorPureBottom
  - jesRelativeBal
  - jesRelativeSample_2023
  - metUnclust
  - btagcorr
  - btaguncorr
  - pu
  - toppt
  - elecid
  - elecreco
  - electrg
  - tauidjet
  - tauFFstat
  - tauFFsyst
  - tauidjetUncert0
  - tauidjetUncert1
  - tauidjetSystalleras
  - tauidjetSyst2023_postBPix
  - tauidjetSystdm02023_postBPix
  - tauidjetSystdm12023_postBPix
  - tauidjetSystdm102023_postBPix
  - tauidjetSystdm112023_postBPix
  - tauidjetSystTESdm02023_postBPix
  - tauidjetSystTESdm12023_postBPix
  - tauidjetSystTESdm102023_postBPix
  - tauidjetSystTESdm112023_postBPix
  - tauidjetStat1dm02023_postBPix
  - tauidjetStat1dm12023_postBPix
  - tauidjetStat1dm102023_postBPix
  - tauidjetStat1dm112023_postBPix
  - tauidjetStat2dm02023_postBPix
  - tauidjetStat2dm12023_postBPix
  - tauidjetStat2dm102023_postBPix
  - tauidjetStat2dm112023_postBPix
  - tauidjetHighptstat_bin1
  - tauidjetHighptstat_bin2
  - tauidjetHighptsyst
  - tauidjetHighptextrap
  - tauidmu
  - tauidel
  - mescale: {type: shape, on: '(hist_TTto(2L2Nu|LNu2Q|4Q)|-LFV-)'}
  - renscale: {type: shape, on: '(hist_TTto(2L2Nu|LNu2Q|4Q)|-LFV-)'}
  - facscale: {type: shape, on: '(hist_TTto(2L2Nu|LNu2Q|4Q)|-LFV-)'}
  - isr: {type: shape, on: '(hist_TTto(2L2Nu|LNu2Q|4Q)|-LFV-)'}
  - fsr: {type: shape, on: '(hist_TTto(2L2Nu|LNu2Q|4Q)|-LFV-)'}
  - pdfalphas: {type: shape, on: 'hist_TTto(2L2Nu|LNu2Q|4Q)'}
  ##- pdfenv: {type: shape, on: 'TTTo'}
  ##- pdfenv: {type: shape, on: '_LFV'}
  - hdamp: {type: shape, on: 'hist_TTto(2L2Nu|LNu2Q|4Q)'}
  - tune: {type: shape, on: 'hist_TTto(2L2Nu|LNu2Q|4Q)'}


plots:
  #include: ['histos_FFcalc.yml']
